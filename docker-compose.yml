services:
  app:
    build:
      context: .
      args:
        DEV_TO_API_KEY: ${DEV_TO_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - devto_cache:/app/.cache
    env_file:
      - .env
    environment:
      NUXT_DEV_TO_API_KEY: ${DEV_TO_API_KEY}
    restart: unless-stopped

volumes:
  devto_cache:
